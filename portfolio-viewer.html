<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Prompt Bazaar</title>
    <meta name="description" content="Professional AI-generated interactive portfolio powered by Prompt Bazaar Pro.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0D6EFD;
            --primary-hover: #0b5ed7;
            --accent: #6366F1;
            --text-main: #0F172A;
            --text-muted: #475569;
            --bg-base: #F8FAFC;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --shadow-soft: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
            --shadow-hover: 0 20px 40px -10px rgba(13, 110, 253, 0.14), 0 8px 16px -4px rgba(15, 23, 42, 0.06);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        /* Animated SaaS Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(at 20% 15%, rgba(13, 110, 253, 0.12) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 15% 80%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
            filter: blur(40px);
        }

        /* Responsive Container Rules (Mobile-First) */
        .container {
            width: 100%;
            padding: 0 16px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 720px;
                padding: 0 24px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 960px;
                padding: 0 32px;
            }
        }

        @media (min-width: 1280px) {
            .container {
                max-width: 1200px;
                padding: 0 48px;
            }
        }

        /* Navigation Bar */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
            padding: clamp(12px, 2vw, 16px) 0;
            transition: all 0.3s ease;
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-link {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.15rem, 2.4vw, 1.4rem);
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-link span {
            color: var(--primary);
        }

        .nav-cta {
            background: var(--primary);
            color: #ffffff;
            padding: clamp(8px, 1.8vw, 11px) clamp(16px, 3vw, 24px);
            border-radius: 9999px;
            font-weight: 600;
            font-size: clamp(0.84rem, 1.5vw, 0.92rem);
            text-decoration: none;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
            box-shadow: 0 4px 14px rgba(13, 110, 253, 0.25);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 110, 253, 0.38);
        }

        /* Section Global Spacing */
        .section {
            padding: clamp(48px, 8vw, 84px) 0;
            position: relative;
        }

        .section-header {
            margin-bottom: clamp(28px, 5vw, 42px);
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.65rem, 4vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-main);
            line-height: 1.2;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 1.8vw, 1.1rem);
            margin-top: 6px;
        }

        /* Hero Section */
        .hero-section {
            padding: clamp(56px, 10vw, 108px) 0 clamp(48px, 8vw, 84px);
            text-align: center;
        }

        .avatar-wrap {
            width: clamp(124px, 20vw, 168px);
            height: clamp(124px, 20vw, 168px);
            margin: 0 auto clamp(20px, 4vw, 28px);
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            position: relative;
            background: #EFF6FF;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .avatar-wrap:hover img {
            transform: scale(1.06);
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-main) 0%, #1E293B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-role {
            font-size: clamp(1.15rem, 2.6vw, 1.6rem);
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .hero-summary {
            max-width: 680px;
            margin: 0 auto clamp(24px, 4vw, 32px);
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.18rem);
            line-height: 1.75;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            padding: clamp(11px, 2vw, 14px) clamp(22px, 4vw, 32px);
            border-radius: 14px;
            font-weight: 600;
            font-size: clamp(0.92rem, 1.6vw, 1rem);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.26);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(13, 110, 253, 0.38);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: clamp(11px, 2vw, 14px) clamp(22px, 4vw, 32px);
            border-radius: 14px;
            font-weight: 600;
            font-size: clamp(0.92rem, 1.6vw, 1rem);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-soft);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        /* Glass Cards & Grid System */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: clamp(18px, 3vw, 28px);
        }

        @media (max-width: 767px) {
            .card-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: clamp(22px, 4vw, 32px);
            box-shadow: var(--shadow-soft);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(13, 110, 253, 0.4);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.18rem, 2.4vw, 1.4rem);
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .card-meta {
            color: var(--primary);
            font-size: clamp(0.86rem, 1.6vw, 0.94rem);
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-body {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 1.7vw, 1.02rem);
            line-height: 1.7;
            flex-grow: 1;
        }

        /* Skill Chips */
        .skill-grid {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(10px, 2vw, 14px);
        }

        .skill-chip {
            background: #EFF6FF;
            color: var(--primary);
            padding: clamp(8px, 1.6vw, 11px) clamp(16px, 3vw, 22px);
            border-radius: 9999px;
            font-weight: 600;
            font-size: clamp(0.88rem, 1.6vw, 0.96rem);
            border: 1px solid rgba(13, 110, 253, 0.2);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .skill-chip:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 16px rgba(13, 110, 253, 0.25);
        }

        /* Project & Certificate Image Wrap */
        .card-img-wrap {
            width: 100%;
            height: clamp(180px, 28vw, 230px);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #F1F5F9;
            position: relative;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.07);
        }

        /* Contact Section */
        .contact-card {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #ffffff;
            border-radius: 28px;
            padding: clamp(36px, 8vw, 64px) clamp(24px, 6vw, 48px);
            text-align: center;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.2);
            position: relative;
            overflow: hidden;
        }

        .contact-card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .contact-card p {
            color: #94A3B8;
            font-size: clamp(1rem, 2vw, 1.18rem);
            max-width: 580px;
            margin: 0 auto clamp(24px, 4vw, 36px);
        }

        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: clamp(36px, 6vw, 48px) 16px;
            color: var(--text-muted);
            font-size: clamp(0.85rem, 1.5vw, 0.94rem);
            border-top: 1px solid var(--card-border);
            margin-top: clamp(48px, 8vw, 72px);
        }

        footer strong {
            color: var(--text-main);
        }

        /* Loading Skeleton UI */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
            padding: 24px;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid #E2E8F0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Section Reveal Animation */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    <div id="app">
        <div class="loading-screen" id="loadingState">
            <div class="spinner"></div>
            <h2 style="font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:8px;">Loading Portfolio...</h2>
            <p style="color:#64748B;font-size:0.96rem;">Preparing your custom interactive presentation</p>
        </div>
    </div>

    <script>
    (function() {
        const APPS_SCRIPT_API = "https://script.google.com/macros/s/AKfycbzVOqOCQuvLHp59mBKes38ZJ9WouIKVDf6GN1MxF_DOjMdJFrX14sknQjMoYppdIBzy/exec";

        function normalizeImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            var t = url.trim().replace(/^['"]|['"]$/g, '');
            var gdriveMatch = t.match(/drive\.google\.com\/.*(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/i);
            if (gdriveMatch && gdriveMatch[1]) {
                return 'https://lh3.googleusercontent.com/d/' + gdriveMatch[1];
            }
            if (t.indexOf('dropbox.com') !== -1 && t.indexOf('?dl=0') !== -1) {
                return t.replace('?dl=0', '?raw=1');
            }
            return t;
        }

        function getFallbackAvatarSvg(name, color) {
            var initials = (name || 'PB').trim().split(/\s+/).slice(0, 2).map(function(p){ return p.charAt(0).toUpperCase(); }).join('');
            var c = encodeURIComponent(color || '#0D6EFD');
            return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="' + c + '"/><stop offset="100%" stop-color="%236366F1"/></linearGradient></defs><rect width="240" height="240" fill="url(%23g)" rx="120"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="88" font-weight="800" fill="white">' + initials + '</text></svg>';
        }

        function getFallbackCardSvg(title, color) {
            var c = encodeURIComponent(color || '#0D6EFD');
            var label = encodeURIComponent((title || 'Project').slice(0, 20));
            return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340"><defs><linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23F1F5F9"/><stop offset="100%" stop-color="%23E2E8F0"/></linearGradient></defs><rect width="600" height="340" fill="url(%23cg)"/><circle cx="300" cy="140" r="42" fill="' + c + '" opacity="0.18"/><path d="M285 140l10 10 20-20" stroke="' + c + '" stroke-width="4" fill="none" stroke-linecap="round"/><text x="50%" y="74%" dominant-baseline="middle" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="%23475569">' + label + '</text></svg>';
        }

        function getImageHtml(url, fallbackSvg, altText) {
            var normUrl = normalizeImageUrl(url);
            if (!normUrl) return '<img src="' + fallbackSvg + '" alt="' + altText + '" loading="lazy" decoding="async">';
            var driveId = '';
            var m = (url||'').match(/drive\.google\.com\/.*(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/i);
            if (m && m[1]) driveId = m[1];
            var thumbUrl = driveId ? 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w1000' : fallbackSvg;
            return '<img src="' + normUrl + '" alt="' + altText + '" loading="lazy" decoding="async" onerror="if(this.src!==\'' + thumbUrl + '\'){this.src=\'' + thumbUrl + '\';}else{this.onerror=null;this.src=\'' + fallbackSvg + '\';}">';
        }

        function buildPortfolioMarkup(username, state) {
            var name = (state.personal && state.personal.name) || state.name || 'Professional Portfolio';
            var role = (state.personal && state.personal.role) || state.role || 'Software & Technology Creator';
            var email = (state.personal && state.personal.email) || state.email || '';
            var phone = (state.personal && state.personal.phone) || state.phone || '';
            var resumeUrl = (state.personal && (state.personal.resumeUrl || state.personal.resume_url)) || state.resumeUrl || '';
            var photoUrl = (state.personal && (state.personal.photoUrl || state.personal.photo)) || state.photo;
            var primary = state.colorPalette || '#0D6EFD';
            var summary = state.summary || 'Welcome to my professional portfolio showcasing key technical projects, expertise, and measurable achievements.';
            var skillsRaw = typeof state.skills === 'string' ? state.skills.split(/[,\n]+/) : (state.skills || []);
            var skills = skillsRaw.map(function(s){ return typeof s === 'string' ? s.trim() : s; }).filter(Boolean);

            var fallbackAvatar = getFallbackAvatarSvg(name, primary);

            var validExp = (state.experience || []).filter(function(e){ return (e.company||'').trim() || (e.role||'').trim() || (e.description||'').trim(); });
            var validProj = (state.projects || []).filter(function(p){ return (p.title||'').trim() || (p.description||'').trim() || (p.imageUrl||'').trim() || (p.link||'').trim(); });
            var validEdu = (state.education || []).filter(function(ed){ return (ed.institution||'').trim() || (ed.degree||'').trim() || (ed.year||'').trim(); });
            var validCert = (state.certificates || []).filter(function(c){ return (c.name||'').trim() || (c.issuer||'').trim() || (c.imageUrl||'').trim(); });

            var html = '';

            // Apply custom primary color to root
            html += '<style>:root { --primary: ' + primary + '; }</style>';

            // NAVBAR
            html += '<nav class="navbar"><div class="container nav-inner">';
            html += '<a href="#hero" class="brand-link"><i class="fas fa-layer-group"></i> ' + name + '</a>';
            html += '<a href="#contact" class="nav-cta">Get in Touch</a>';
            html += '</div></nav>';

            // HERO ↓
            html += '<section class="hero-section" id="hero"><div class="container">';
            html += '<div class="avatar-wrap">' + getImageHtml(photoUrl, fallbackAvatar, name) + '</div>';
            html += '<h1 class="hero-title">' + name + '</h1>';
            html += '<div class="hero-role">' + role + '</div>';
            html += '<p class="hero-summary">' + summary + '</p>';
            html += '<div class="hero-actions">';
            if (resumeUrl && /^https?:\/\//i.test(resumeUrl)) {
                html += '<a href="' + resumeUrl + '" target="_blank" class="btn-primary"><i class="fas fa-file-alt"></i> View Resume</a>';
            }
            html += '<a href="#contact" class="btn-outline"><i class="fas fa-paper-plane"></i> Contact Me</a>';
            html += '</div></div></section>';

            // ABOUT ↓
            html += '<section class="section reveal" id="about"><div class="container">';
            html += '<div class="section-header"><h2 class="section-title">About Me</h2></div>';
            html += '<div class="card"><p class="card-body" style="font-size:clamp(1rem,1.8vw,1.08rem);">' + summary + '</p></div>';
            html += '</div></section>';

            // SKILLS ↓
            if (skills.length > 0) {
                html += '<section class="section reveal" id="skills"><div class="container">';
                html += '<div class="section-header"><h2 class="section-title">Core Competencies</h2><div class="section-subtitle">Skills & expertise across tools and technologies</div></div>';
                html += '<div class="skill-grid">';
                skills.forEach(function(s) {
                    html += '<span class="skill-chip"><i class="fas fa-check-circle" style="font-size:0.85rem;"></i> ' + s + '</span>';
                });
                html += '</div></div></section>';
            }

            // PROJECTS ↓
            if (validProj.length > 0) {
                html += '<section class="section reveal" id="projects"><div class="container">';
                html += '<div class="section-header"><h2 class="section-title">Featured Projects</h2><div class="section-subtitle">Selected works and technical highlights</div></div>';
                html += '<div class="card-grid">';
                validProj.forEach(function(p) {
                    var fallbackProjSvg = getFallbackCardSvg(p.title || 'Project', primary);
                    html += '<div class="card">';
                    html += '<div class="card-img-wrap">' + getImageHtml(p.imageUrl, fallbackProjSvg, p.title || 'Project') + '</div>';
                    html += '<h3 class="card-title">' + (p.title || 'Project') + '</h3>';
                    html += '<p class="card-body">' + (p.description || '') + '</p>';
                    if (p.link && /^https?:\/\//i.test(p.link)) {
                        html += '<div style="margin-top:20px;"><a href="' + p.link + '" target="_blank" class="btn-outline" style="padding:9px 20px;font-size:0.88rem;">Explore Project <i class="fas fa-external-link-alt"></i></a></div>';
                    }
                    html += '</div>';
                });
                html += '</div></div></section>';
            }

            // EXPERIENCE ↓
            if (validExp.length > 0) {
                html += '<section class="section reveal" id="experience"><div class="container">';
                html += '<div class="section-header"><h2 class="section-title">Professional Experience</h2><div class="section-subtitle">My career path and key leadership roles</div></div>';
                html += '<div class="card-grid">';
                validExp.forEach(function(e) {
                    html += '<div class="card">';
                    html += '<h3 class="card-title">' + (e.role || 'Role') + '</h3>';
                    html += '<div class="card-meta"><i class="fas fa-building"></i> ' + (e.company || 'Company') + ' &bull; ' + (e.duration || '') + '</div>';
                    html += '<p class="card-body">' + (e.description || '') + '</p>';
                    html += '</div>';
                });
                html += '</div></div></section>';
            }

            // EDUCATION ↓
            if (validEdu.length > 0) {
                html += '<section class="section reveal" id="education"><div class="container">';
                html += '<div class="section-header"><h2 class="section-title">Education</h2></div>';
                html += '<div class="card-grid">';
                validEdu.forEach(function(ed) {
                    html += '<div class="card">';
                    html += '<h3 class="card-title">' + (ed.degree || 'Degree') + '</h3>';
                    html += '<div class="card-meta"><i class="fas fa-university"></i> ' + (ed.institution || 'Institution') + ' &bull; ' + (ed.year || '') + '</div>';
                    html += '</div>';
                });
                html += '</div></div></section>';
            }

            // CERTIFICATES ↓
            if (validCert.length > 0) {
                html += '<section class="section reveal" id="certificates"><div class="container">';
                html += '<div class="section-header"><h2 class="section-title">Certifications</h2></div>';
                html += '<div class="card-grid">';
                validCert.forEach(function(c) {
                    var fallbackCertSvg = getFallbackCardSvg(c.name || 'Certificate', primary);
                    html += '<div class="card">';
                    if (c.imageUrl) {
                        html += '<div class="card-img-wrap" style="height:150px;">' + getImageHtml(c.imageUrl, fallbackCertSvg, c.name || 'Certificate') + '</div>';
                    }
                    html += '<h3 class="card-title">' + (c.name || 'Certificate') + '</h3>';
                    html += '<div class="card-meta"><i class="fas fa-award"></i> ' + (c.issuer || 'Issuer') + '</div>';
                    html += '</div>';
                });
                html += '</div></div></section>';
            }

            // ACHIEVEMENTS ↓
            var achievementsText = (state.achievements || '').trim();
            if (achievementsText) {
                var achievementLines = achievementsText.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
                if (achievementLines.length > 0) {
                    html += '<section class="section reveal" id="achievements"><div class="container">';
                    html += '<div class="section-header"><h2 class="section-title">Honors &amp; Achievements</h2></div>';
                    html += '<div class="card-grid">';
                    achievementLines.forEach(function(item) {
                        html += '<div class="card" style="flex-direction:row;align-items:flex-start;gap:16px;">';
                        html += '<i class="fas fa-trophy" style="color:#F59E0B;font-size:1.5rem;margin-top:2px;flex-shrink:0;"></i>';
                        html += '<div><h3 class="card-title" style="margin-bottom:4px;">Achievement</h3><p class="card-body">' + item + '</p></div>';
                        html += '</div>';
                    });
                    html += '</div></div></section>';
                }
            }

            // CONTACT ↓
            html += '<section class="section reveal" id="contact"><div class="container">';
            html += '<div class="contact-card">';
            html += '<h2>Let&rsquo;s Connect</h2>';
            html += '<p>Open to professional opportunities, technical collaborations, and innovative projects. Reach out directly.</p>';
            html += '<div class="contact-actions">';
            if (email) {
                html += '<a href="mailto:' + email + '" class="btn-primary" style="background:#ffffff;color:#0F172A;"><i class="fas fa-envelope"></i> ' + email + '</a>';
            }
            if (phone) {
                html += '<a href="tel:' + phone + '" class="btn-primary" style="background:rgba(255,255,255,0.18);color:#ffffff;"><i class="fas fa-phone"></i> ' + phone + '</a>';
            }
            html += '</div></div></div></section>';

            // FOOTER ↓
            html += '<footer><div class="container">&copy; ' + new Date().getFullYear() + ' ' + name + ' &bull; Powered by <strong>Prompt Bazaar Labs</strong></div></footer>';

            return html;
        }

        function initScrollAnimations() {
            var reveals = document.querySelectorAll('.reveal');
            if ('IntersectionObserver' in window) {
                var obs = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });
                reveals.forEach(function(el) { obs.observe(el); });
            } else {
                reveals.forEach(function(el) { el.classList.add('active'); });
            }
        }

        function renderPortfolio(username, state) {
            var app = document.getElementById('app');
            app.innerHTML = buildPortfolioMarkup(username, state);
            initScrollAnimations();
        }

        function showNotFound(msg) {
            var app = document.getElementById('app');
            app.innerHTML = '<div class="container" style="max-width:520px;margin:80px auto;text-align:center;">' +
                '<div class="card" style="padding:44px 28px;">' +
                '<i class="fas fa-layer-group" style="font-size:2.8rem;color:#0D6EFD;margin-bottom:16px;"></i>' +
                '<h2 style="font-family:\'Outfit\',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:12px;">Portfolio Not Found</h2>' +
                '<p style="color:#64748B;margin-bottom:28px;">' + (msg || 'We couldn\'t load this portfolio. Generate and publish your custom portfolio in seconds.') + '</p>' +
                '<a href="/tools.html" class="btn-primary" style="justify-content:center;">Go to Portfolio Builder Pro</a>' +
                '</div></div>';
        }

        var params = new URLSearchParams(window.location.search);
        var lookup = params.get('u') || params.get('username') || params.get('id');
        if (!lookup && window.location.pathname.indexOf('/p/') !== -1) {
            lookup = window.location.pathname.split('/p/')[1];
        }
        if (!lookup && window.location.pathname.indexOf('/u/') !== -1) {
            lookup = window.location.pathname.split('/u/')[1];
        }

        // 1. If base64 data parameter is still passed (legacy links), decode & render
        var d = params.get('d') || params.get('data');
        if (d) {
            try {
                var decodedState = JSON.parse(decodeURIComponent(escape(atob(d))));
                renderPortfolio(lookup || 'portfolio', decodedState);
                return;
            } catch(e) {}
        }

        // 2. Fast check in local storage state if present (0ms instant render)
        if (lookup) {
            try {
                var cachedState = localStorage.getItem('portfolio_state_' + lookup);
                if (cachedState) {
                    renderPortfolio(lookup, JSON.parse(cachedState));
                    return;
                }
                var allPortfolios = JSON.parse(localStorage.getItem('pb_user_portfolios') || '[]');
                var matched = allPortfolios.find(function(item) { return item.username === lookup || item.id === lookup; });
                if (matched && matched.data) {
                    renderPortfolio(lookup, matched.data);
                    return;
                }
                var cachedHtml = localStorage.getItem('portfolio_html_' + lookup);
                if (cachedHtml) {
                    document.open();
                    document.write(cachedHtml);
                    document.close();
                    return;
                }
            } catch(e) {}
        }

        if (!lookup) {
            try {
                var latestState = localStorage.getItem('portfolio_latest_state');
                if (latestState) {
                    renderPortfolio('My Portfolio', JSON.parse(latestState));
                    return;
                }
            } catch(e) {}
            showNotFound();
            return;
        }

        // 3. Ultra-Fast Parallel Fetch Race: Check local backend API first, then Apps Script API
        var apiFastUrl = '/api/portfolio/' + encodeURIComponent(lookup);
        fetch(apiFastUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.success && data.html) {
                document.open();
                document.write(data.html);
                document.close();
            } else {
                throw new Error('Not cached on origin');
            }
        })
        .catch(function() {
            // Check static server file
            fetch('/static/portfolios/' + encodeURIComponent(lookup) + '.html')
            .then(function(res) {
                if (!res.ok) throw new Error('Not found on static server');
                return res.text();
            })
            .then(function(htmlText) {
                document.open();
                document.write(htmlText);
                document.close();
            })
            .catch(function() {
                // Final fallback: Google Apps Script API endpoint
                var apiUrl = APPS_SCRIPT_API + '?action=get_portfolio&username=' + encodeURIComponent(lookup);
                fetch(apiUrl)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && data.success && data.portfolio) {
                        renderPortfolio(lookup, data.portfolio);
                    } else {
                        showNotFound();
                    }
                })
                .catch(function() {
                    showNotFound();
                });
            });
        });
    })();
    </script>
</body>
</html>
