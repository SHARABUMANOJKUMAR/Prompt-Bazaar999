name: Portfolio Builder Pro - Continuous Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy_firebase_hosting:
    name: Deploy Static Engine to Firebase Hosting
    runs-on: ubuntu-latest
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == ''push'' }}'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROMPT_BAZAAR }}'
          channelId: live
          projectId: prompt-bazaar
