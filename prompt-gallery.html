<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Gallery - Prompt Bazaar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1778936080/Prompt_Bazaar_Favican_sk4rnu.png">
    
<link rel="stylesheet" href="/static/css/gallery.css">

    
    <script>
        window.FIREBASE_CONFIG = {"apiKey": "YOUR_FIREBASE_API_KEY", "appId": "YOUR_FIREBASE_APP_ID", "authDomain": "YOUR_FIREBASE_AUTH_DOMAIN", "messagingSenderId": "YOUR_FIREBASE_MESSAGING_SENDER_ID", "projectId": "YOUR_FIREBASE_PROJECT_ID", "storageBucket": "YOUR_FIREBASE_STORAGE_BUCKET"};
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <!-- Global Modal Backdrop -->
    <div id="modal-backdrop" class="modal-backdrop"></div>

    <!-- Global Prompt Preview Modal -->
    <div id="prompt-modal" class="modal-overlay">
        <div class="modal-header">
            <div id="modal-platform" class="platform-badge">MIDJOURNEY</div>
            <button id="close-modal" class="close-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-image-container">
            <img id="modal-image" src="" alt="Prompt Preview">
        </div>
        <div class="modal-content">
            <h2 id="modal-title" class="text-h3 mb-2">Prompt Title</h2>
            <div id="modal-price" class="price-badge mb-4" style="position:static; display:inline-block">₹2</div>
            
            <div class="modal-actions">
                <button class="action-btn" id="modal-wishlist">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span>Wishlist</span>
                </button>
                <button class="action-btn" id="modal-share" onclick="sharePrompt(currentPrompt)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span>Share</span>
                </button>
                <button class="action-btn" id="modal-report" onclick="openReportModal(currentPrompt)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
                    <span>Report</span>
                </button>
            </div>
            
            <button id="modal-primary-action" class="btn btn-primary mt-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span class="btn-text">🔒 UNLOCK PROMPT</span>
            </button>
        </div>
    </div>

    
<div class="gallery-layout">
    <!-- Top Navbar -->
    <header class="gallery-header">
        <div class="header-left">
            <img src="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1778935629/Prompt_Bazaar_Logo_h4ga2c.png" alt="Logo">
            Prompt Bazaar
        </div>
        <div class="header-right">
            <div class="notification-wrapper" style="position: relative;">
                <button class="icon-btn" id="notificationBtn" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                </button>
                <div id="notificationDropdown" class="notification-dropdown">
                    <div class="notif-header">Notifications</div>
                    <ul id="notificationList">
                        <li class="empty-notif text-secondary">No new notifications</li>
                    </ul>
                </div>
            </div>
            <a href="/profile" class="user-avatar" title="Profile">
                
                    U
                
            </a>
        </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title">Prompt Gallery</h1>
        <p class="page-subtitle">Discover high-converting AI prompts for ChatGPT, Midjourney, LinkedIn, YouTube, coding, and business.</p>
    </div>

    <!-- Search Bar -->
    <div class="filters-container">
        <div class="search-bar-wrapper">
            <div class="search-input-container">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" id="promptSearch" placeholder="Search prompts, creators, or categories...">
            </div>
        </div>
        
        <div class="category-chips">
            <button class="chip active" data-category="All">All</button>
            <button class="chip" data-category="Couple">Couple</button>
            <button class="chip" data-category="Kids">Kids</button>
            <button class="chip" data-category="Men">Men</button>
            <button class="chip" data-category="Women">Women</button>
            <button class="chip" data-category="Business">Business</button>
            <button class="chip" data-category="LinkedIn">LinkedIn</button>
            <button class="chip" data-category="YouTube">YouTube</button>
        </div>
    </div>

    <!-- Prompt Cards Grid -->
    <main id="promptGrid" class="prompt-grid">
        <!-- Cards injected by JS -->
    </main>

    <!-- Pagination -->
    <div class="pagination-container">
        <button class="load-more-btn" id="loadMoreBtn">Load More Prompts</button>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

<!-- Report Modal -->
<div id="reportModal" class="modal">
  <div class="modal-content report-modal-content">
    <button class="close-btn" style="position: absolute; top: 1rem; right: 1rem;" onclick="closeReportModal()">×</button>

    <h2 style="color: var(--color-text-primary);">Report Prompt</h2>
    <p style="color: var(--color-text-secondary);">Please tell us why you are reporting this prompt.</p>

    <form id="reportForm" class="report-form">
        <input type="hidden" id="reportPromptId" name="prompt_id">

        <div class="report-form-group">
            <label for="reportUserName" style="color: var(--color-text-main);">Your Name</label>
            <input type="text" id="reportUserName" name="user_name" placeholder="Enter your full name" required style="background: var(--color-bg-primary); color: var(--color-text-main); border: 1px solid var(--color-border);">
        </div>

        <div class="report-form-group">
            <label for="reportUserEmail" style="color: var(--color-text-main);">Your Email</label>
            <input type="email" id="reportUserEmail" name="user_email" placeholder="Enter your email address" required style="background: var(--color-bg-primary); color: var(--color-text-main); border: 1px solid var(--color-border);">
        </div>

        <div class="report-form-group">
            <label for="reportReason" style="color: var(--color-text-main);">Reason</label>
            <select id="reportReason" name="reason" required style="background: var(--color-bg-primary); color: var(--color-text-main); border: 1px solid var(--color-border);">
                <option value="">Select a reason</option>
                <option value="Inappropriate Content">Inappropriate Content</option>
                <option value="Spam">Spam</option>
                <option value="Copyright Violation">Copyright Violation</option>
                <option value="Misleading Information">Misleading Information</option>
                <option value="Broken Prompt">Broken Prompt</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="report-form-group">
            <label for="reportDetails" style="color: var(--color-text-main);">Additional Details</label>
            <textarea id="reportDetails" name="details" placeholder="Explain the issue..." style="background: var(--color-bg-primary); color: var(--color-text-main); border: 1px solid var(--color-border);"></textarea>
        </div>

        <button type="submit" class="report-submit-btn" style="background: var(--gradient-primary);">
            Submit Report
        </button>
    </form>
  </div>
</div>


    
    <!-- Web Push Notifications -->
    <script type="module" src="/static/js/notifications.js"></script>

    
<script type="module" src="/static/js/gallery.js"></script>

</body>
</html>
