<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Bazaar Academy - Prompt Engineering Course</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1778936080/Prompt_Bazaar_Favican_sk4rnu.png">
    
    <link rel="stylesheet" href="/static/css/gallery.css">
    <link rel="stylesheet" href="/static/css/academy.css">
    <meta name="description" content="Prompt Bazaar Academy — Learn Prompt Engineering from Scratch to Professional Level with Real-World Projects.">
    
    <script>
        window.FIREBASE_CONFIG = {"apiKey": "YOUR_FIREBASE_API_KEY", "appId": "YOUR_FIREBASE_APP_ID", "authDomain": "YOUR_FIREBASE_AUTH_DOMAIN", "messagingSenderId": "YOUR_FIREBASE_MESSAGING_SENDER_ID", "projectId": "YOUR_FIREBASE_PROJECT_ID", "storageBucket": "YOUR_FIREBASE_STORAGE_BUCKET"};
    </script>
</head>
<body>
    <!-- Sidebar Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar-drawer" id="sidebarDrawer">
        <div class="sidebar-brand">
            <div class="sidebar-brand-left">
                <img src="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1778935629/Prompt_Bazaar_Logo_h4ga2c.png" alt="Logo">
                Prompt Bazaar
            </div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Navigation</div>
            <a href="/" class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Home</a>
            <a href="/gallery" class="sidebar-nav-item"><span class="sidebar-icon">🖼️</span> Prompt Gallery</a>
            <a href="/tools" class="sidebar-nav-item"><span class="sidebar-icon">🛠️</span> Prompt Tools</a>
            <a href="/academy" class="sidebar-nav-item active"><span class="sidebar-icon">🎓</span> Academy</a>
        </nav>
        <div class="sidebar-footer">
            © 2025 Prompt Bazaar. All rights reserved.
        </div>
    </aside>

    <div class="academy-page">
        <!-- Top Navbar (matches gallery) -->
        <header class="gallery-header">
            <div class="header-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="/gallery" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
                    <img src="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1778935629/Prompt_Bazaar_Logo_h4ga2c.png" alt="Logo">
                    Prompt Bazaar
                </a>
            </div>
            <div class="header-right">
                <a href="/profile" class="user-avatar" id="headerUserAvatar" title="Profile">
                    U
                </a>
            </div>
        </header>

        <!-- Main Content Area Container -->
        <div id="academy-container" class="academy-container">
            <!-- Loading State -->
            <div id="academy-loading" class="academy-loading">
                <div class="spinner"></div>
                <p>Loading your learning environment...</p>
            </div>
            
            <!-- Views will be injected here via JS -->
            <div id="academy-view" style="display:none;"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script type="module" src="/static/js/academy.js"></script>
</body>
</html>
