<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manoj Achari | Senior Full Stack & Ai Architect</title>
    <meta name="description" content="Innovative professional dedicated to building high-quality, scalable solutions and delivering exceptional results.">
    <meta name="keywords" content="Manoj Achari, Senior Full Stack & Ai Architect, developer, portfolio">
    <meta name="author" content="Manoj Achari">
    <meta property="og:title" content="Manoj Achari | Senior Full Stack & Ai Architect">
    <meta property="og:description" content="Innovative professional dedicated to building high-quality, scalable solutions and delivering exceptional results.">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0D6EFD;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg-base: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 10px 32px 0 rgba(31, 38, 135, 0.08);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        /* Vibrant animated background mesh */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: 
                radial-gradient(at 25% 20%, #0D6EFD26 0px, transparent 55%),
                radial-gradient(at 80% 15%, rgba(168, 85, 247, 0.16) 0px, transparent 55%),
                radial-gradient(at 15% 75%, rgba(236, 72, 153, 0.14) 0px, transparent 55%);
            filter: blur(45px);
            animation: pulseBg 12s ease-in-out infinite alternate;
        }
        @keyframes pulseBg {
            0% { opacity: 0.85; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        /* Sticky Navigation Bar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.7);
            padding: 14px 0;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span {
            color: var(--primary);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s, transform 0.2s;
        }
        .nav-links a:hover {
            color: var(--primary);
            transform: translateY(-1px);
        }
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }
        @media (min-width: 768px) {
            .container {
                max-width: 720px;
                padding: 0 24px;
            }
        }
        @media (min-width: 1024px) {
            .container {
                max-width: 960px;
                padding: 0 32px;
            }
        }
        @media (min-width: 1280px) {
            .container {
                max-width: 1200px;
                padding: 0 48px;
            }
        }
        
        /* Hero Section */
        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            padding: 70px 0 60px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-content {
            flex: 1;
            max-width: 680px;
        }
        .hero-img {
            width: clamp(180px, 28vw, 260px);
            height: clamp(180px, 28vw, 260px);
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
            animation: floatImage 6s ease-in-out infinite;
        }
        @keyframes floatImage {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1.5deg); }
        }
        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.1rem, 5.5vw, 4rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        .hero h2 {
            font-size: clamp(1.15rem, 2.6vw, 1.6rem);
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 18px;
        }
        .hero p {
            font-size: clamp(0.98rem, 1.8vw, 1.12rem);
            color: var(--text-muted);
            margin-bottom: 28px;
            max-width: 65ch;
        }
        .social-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .social-links a.icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.15rem;
            text-decoration: none;
            box-shadow: var(--glass-shadow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .social-links a.icon-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-4px) scale(1.08);
        }
        .resume-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--primary);
            color: #ffffff !important;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
            min-height: 44px;
        }
        .resume-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }
        
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 700;
            margin-bottom: 28px;
            color: var(--text-main);
        }
        section {
            padding: 48px 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 26px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 42px rgba(31, 38, 135, 0.16);
        }
        .glass-card:hover .project-card-img {
            transform: scale(1.08);
        }
        .glass-card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-main);
        }
        .glass-card .subtitle {
            font-size: 0.92rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 14px;
        }
        .glass-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex: 1;
            line-height: 1.6;
        }
        .project-img-wrapper {
            margin: -26px -26px 18px -26px;
            overflow: hidden;
            border-radius: 20px 20px 0 0;
            background: #e2e8f0;
        }
        .project-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
        }
        
        /* Skills Section */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .skill-tag {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.22);
            transition: background 0.25s, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .skill-tag:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-2px) scale(1.05);
        }
        /* Responsive Breakpoints matching Device Categories */
        @media (max-width: 479px) {
            .navbar { padding: 14px 16px; }
            .container { width: 100%; max-width: 100%; padding: 0 14px; margin: 0 auto; }
            .hero { flex-direction: column-reverse; text-align: center; gap: 24px; padding: 36px 0; }
            .hero h1 { font-size: 2.1rem; }
            .hero-img { width: 130px; height: 130px; }
            .social-links { justify-content: center; gap: 10px; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
            .glass-card { padding: 20px; border-radius: 16px; }
        }
        @media (min-width: 480px) and (max-width: 767px) {
            .navbar { padding: 16px 20px; }
            .container { width: 100%; max-width: 460px; padding: 0 16px; margin: 0 auto; }
            .hero { flex-direction: column-reverse; text-align: center; gap: 28px; padding: 48px 0; }
            .grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
            .glass-card { padding: 22px; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .navbar { padding: 16px 32px; }
            .container { width: 100%; max-width: 750px; padding: 0 24px; margin: 0 auto; }
            .grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="#" class="brand"><i class="fas fa-briefcase"></i> <span>Manoj Achari</span></a>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>            </ul>
        </div>
    </nav>
    
    <div class="container">
        <header class="hero" id="about">
            <div class="hero-content">
                <h1>Manoj Achari</h1>
                <h2>Senior Full Stack & Ai Architect</h2>
                <p>Innovative professional dedicated to building high-quality, scalable solutions and delivering exceptional results.</p>
                
                <div class="social-links">                    <a href="mailto:manoj@example.com" title="Email" class="icon-btn"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </header>
        <footer style="text-align:center; padding: 60px 0 40px; opacity: 0.7; font-size:0.92rem;">
            <p>&copy; Manoj Achari &bull; Powered by AI Portfolio Builder Pro</p>
        </footer>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var anim = "3D Tilt & Glow";
        if (anim === '3D Tilt & Glow') {
            document.querySelectorAll('.glass-card').forEach(function(card) {
                card.style.transformStyle = 'preserve-3d';
                card.style.transition = 'transform 0.15s ease-out, box-shadow 0.3s ease';
                card.addEventListener('mousemove', function(e) {
                    var rect = card.getBoundingClientRect();
                    var x = e.clientX - rect.left, y = e.clientY - rect.top;
                    var rotateX = ((y - rect.height/2) / (rect.height/2)) * -6;
                    var rotateY = ((x - rect.width/2) / (rect.width/2)) * 6;
                    card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.02,1.02,1.02)';
                });
                card.addEventListener('mouseleave', function() {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
                });
            });
        }
    });
    </script>
</body>
</html>
