<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Bazaar | Portfolio Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; position: relative; perspective: 1000px; }
        
        /* Minimal Loader Styles */
        .loader-container { text-align: center; z-index: 10; padding: 30px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }

        h1 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; margin-bottom: 12px; background: linear-gradient(to right, #60A5FA, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94A3B8; font-size: 1.1rem; }
        
        .error-card { display: none; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); padding: 50px; border-radius: 24px; border: 1px solid rgba(239, 68, 68, 0.2); max-width: 500px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05); }
        .error-card h1 { background: linear-gradient(to right, #F87171, #FCA5A5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; font-size: 2.5rem; }
        .error-card p { color: #CBD5E1; margin-bottom: 30px; line-height: 1.6; }
        .error-card a { display: inline-block; background: linear-gradient(135deg, #3B82F6, #8B5CF6); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-family: 'Outfit', sans-serif; transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
        .error-card a:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4); }
    </style>
    <script src="/static/js/portfolio-engine.js"></script>
</head>
<body>
    <div class="loader-container" id="loader">
        <h1 style="font-size:1.5rem; margin-bottom: 8px;">Loading Portfolio...</h1>
        <p style="font-size:0.9rem; color:#94A3B8;">Please wait a moment while we fetch the data.</p>
    </div>

    <div class="error-card" id="errorCard">
        <div style="font-size: 4rem; margin-bottom: 20px;">🛸</div>
        <h1>Portfolio Not Found</h1>
        <p>We couldn't locate this portfolio in the Prompt Bazaar network. The link may have expired, or the user hasn't published it yet.</p>
        <a href="/tools">Build Your Own Portfolio</a>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            // 3D Tilt Effect on Loader
            const loader = document.getElementById('loader');
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let username = '';
            if (pathSegments.length >= 2 && (pathSegments[0] === 'p' || pathSegments[0] === 'portfolio' || pathSegments[0] === 'u')) {
                username = decodeURIComponent(pathSegments[1]);
            }

            if (!username) {
                showError();
                return;
            }

            const localHtml = localStorage.getItem('portfolio_html_' + username);
            if (localHtml) {
                document.open();
                document.write(localHtml);
                document.close();
                return;
            }

            const scriptUrl = 'https://script.google.com/macros/s/AKfycbxcKwme0jLTjaGL5jxLSa7i0FBejw1FD9TjwIBdSuIsNFekr0LW5Vv7WFhZA84vGdUg/exec';
            fetch(scriptUrl + '?action=get_portfolio&username=' + encodeURIComponent(username))
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        try {
                            const portfolioState = data.portfolio;
                            const html = data.html || (portfolioState ? buildClientSidePortfolioHtml(username, typeof portfolioState === 'string' ? JSON.parse(portfolioState) : portfolioState) : null);
                            
                            if (html) {
                                // Cache for faster subsequent loads on this device
                                try {
                                    localStorage.setItem('portfolio_html_' + username, html);
                                    if (portfolioState) {
                                        localStorage.setItem('portfolio_state_' + username, typeof portfolioState === 'string' ? portfolioState : JSON.stringify(portfolioState));
                                    }
                                } catch (e) {}

                                document.open();
                                document.write(html);
                                document.close();
                            } else {
                                showError("Portfolio data is empty.");
                            }
                        } catch (e) {
                            console.error("Render error:", e);
                            showError("Error rendering portfolio data.");
                        }
                    } else {
                        showError();
                    }
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    showError("Network error. Please try again.");
                });
        });

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errorCard = document.getElementById('errorCard');
            errorCard.style.display = 'block';
            if (msg) {
                document.getElementById('errorMsg').innerText = msg;
            }
        }
    </script>
</body>
</html>
