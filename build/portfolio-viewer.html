<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Bazaar | Portfolio Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; position: relative; perspective: 1000px; }
        
        /* 3D Floating Stickers Background */
        .bg-sticker { position: absolute; opacity: 0.15; filter: blur(2px); animation: floatSticker 20s ease-in-out infinite alternate; pointer-events: none; z-index: -1; }
        .bg-sticker img { width: 100%; height: 100%; object-fit: contain; }
        .bg-sticker-1 { top: 10%; left: 10%; width: 120px; height: 120px; transform: translateZ(-200px) rotate(15deg); animation-delay: 0s; }
        .bg-sticker-2 { bottom: 20%; right: 15%; width: 180px; height: 180px; transform: translateZ(-300px) rotate(-10deg); animation-delay: -5s; }
        .bg-sticker-3 { top: 30%; right: 25%; width: 100px; height: 100px; transform: translateZ(-100px) rotate(25deg); animation-delay: -10s; }
        .bg-sticker-4 { bottom: 10%; left: 20%; width: 150px; height: 150px; transform: translateZ(-250px) rotate(-20deg); animation-delay: -15s; }
        .bg-sticker-5 { top: 50%; left: 40%; width: 250px; height: 250px; transform: translateZ(-400px) rotate(5deg); animation-delay: -7s; opacity: 0.05; }
        
        @keyframes floatSticker {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-30px) rotate(10deg) scale(1.05); }
            100% { transform: translateY(20px) rotate(-10deg) scale(0.95); }
        }

        .loader-container { text-align: center; z-index: 10; padding: 40px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4); transform-style: preserve-3d; animation: tiltIntro 1s cubic-bezier(0.25, 1, 0.5, 1); }
        
        @keyframes tiltIntro {
            0% { transform: translateY(50px) rotateX(20deg) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) rotateX(0deg) scale(1); opacity: 1; }
        }

        .spinner-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 24px; }
        .spinner { border: 4px solid rgba(59, 130, 246, 0.1); width: 100%; height: 100%; border-radius: 50%; border-left-color: #3B82F6; animation: spin 1s linear infinite; position: absolute; top:0; left:0; }
        .spinner-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: #3B82F6; filter: blur(20px); opacity: 0.4; animation: pulse 2s ease-in-out infinite; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.5; transform: scale(1.2); } }

        h1 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; margin-bottom: 12px; background: linear-gradient(to right, #60A5FA, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94A3B8; font-size: 1.1rem; }
        
        .error-card { display: none; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); padding: 50px; border-radius: 24px; border: 1px solid rgba(239, 68, 68, 0.2); max-width: 500px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05); }
        .error-card h1 { background: linear-gradient(to right, #F87171, #FCA5A5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; font-size: 2.5rem; }
        .error-card p { color: #CBD5E1; margin-bottom: 30px; line-height: 1.6; }
        .error-card a { display: inline-block; background: linear-gradient(135deg, #3B82F6, #8B5CF6); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-family: 'Outfit', sans-serif; transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
        .error-card a:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4); }
    </style>
    <script src="/static/js/portfolio-engine.js"></script>
</head>
<body>
    <!-- 3D Background Stickers -->
    <div class="bg-sticker bg-sticker-1"><img src="/static/img/pb-logo-blue.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1157/1157109.png'"></div>
    <div class="bg-sticker bg-sticker-2"><img src="/static/img/pb-logo-blue.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3067/3067258.png'"></div>
    <div class="bg-sticker bg-sticker-3"><img src="/static/img/pb-logo-blue.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2621/2621040.png'"></div>
    <div class="bg-sticker bg-sticker-4"><img src="/static/img/pb-logo-blue.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1085/1085685.png'"></div>
    <div class="bg-sticker bg-sticker-5"><img src="/static/img/pb-logo-blue.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1157/1157109.png'"></div>

    <div class="loader-container" id="loader">
        <div class="spinner-wrapper">
            <div class="spinner-glow"></div>
            <div class="spinner"></div>
        </div>
        <h1>Initializing Portfolio</h1>
        <p>Loading ultra-premium 3D experience...</p>
    </div>

    <div class="error-card" id="errorCard">
        <div style="font-size: 4rem; margin-bottom: 20px;">🛸</div>
        <h1>Portfolio Not Found</h1>
        <p>We couldn't locate this portfolio in the Prompt Bazaar network. The link may have expired, or the user hasn't published it yet.</p>
        <a href="/tools">Build Your Own Portfolio</a>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            // 3D Tilt Effect on Loader
            const loader = document.getElementById('loader');
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let username = '';
            if (pathSegments.length >= 2 && (pathSegments[0] === 'p' || pathSegments[0] === 'portfolio' || pathSegments[0] === 'u')) {
                username = decodeURIComponent(pathSegments[1]);
            }

            if (!username) {
                showError();
                return;
            }

            const localHtml = localStorage.getItem('portfolio_html_' + username);
            if (localHtml) {
                document.open();
                document.write(localHtml);
                document.close();
                return;
            }

            const scriptUrl = 'https://script.google.com/macros/s/AKfycbxcKwme0jLTjaGL5jxLSa7i0FBejw1FD9TjwIBdSuIsNFekr0LW5Vv7WFhZA84vGdUg/exec';
            fetch(scriptUrl + '?action=get_portfolio&username=' + encodeURIComponent(username))
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        try {
                            const portfolioState = data.portfolio;
                            const html = data.html || (portfolioState ? buildClientSidePortfolioHtml(username, typeof portfolioState === 'string' ? JSON.parse(portfolioState) : portfolioState) : null);
                            
                            if (html) {
                                // Cache for faster subsequent loads on this device
                                try {
                                    localStorage.setItem('portfolio_html_' + username, html);
                                    if (portfolioState) {
                                        localStorage.setItem('portfolio_state_' + username, typeof portfolioState === 'string' ? portfolioState : JSON.stringify(portfolioState));
                                    }
                                } catch (e) {}

                                document.open();
                                document.write(html);
                                document.close();
                            } else {
                                showError("Portfolio data is empty.");
                            }
                        } catch (e) {
                            console.error("Render error:", e);
                            showError("Error rendering portfolio data.");
                        }
                    } else {
                        showError();
                    }
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    showError("Network error. Please try again.");
                });
        });

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errorCard = document.getElementById('errorCard');
            errorCard.style.display = 'block';
            if (msg) {
                document.getElementById('errorMsg').innerText = msg;
            }
        }
    </script>
</body>
</html>
